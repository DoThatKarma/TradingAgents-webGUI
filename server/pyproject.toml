[project]
name = "ta-webgui-server"
version = "0.1.0"
description = "TradingAgents-webGUI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]
plugins = ["ta-plugins"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: real-LLM smoke tests, skipped without credentials"]
addopts = "--strict-markers"
pythonpath = ["."]
