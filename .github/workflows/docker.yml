# ----------------------------------------------------------------------------
# TradingAgents-webGUI — server image → GHCR (ADR 0010)
#
# Triggers:
#   * push of a version tag `v*` → pushes semver tags + moving `latest`
#     (deploy/docker-compose.yml pulls ghcr.io/...:latest for upgrades)
#   * workflow_dispatch (manual, any ref) → traceable `sha-<sha>` tag only,
#     never `latest` — useful for testing the image build before cutting a tag
#
# Platform: linux/amd64 only (VPS target). Multi-arch is deliberately skipped.
# Cache: GitHub Actions cache (cache-from/cache-to type=gha, mode=max).
#
# First-run note: the GHCR package is created on the first push and linked to
# this repository. Flip its visibility to public once in package settings
# (or pull with a PAT) — see deploy/ghcr-workflow-design.md.
# ----------------------------------------------------------------------------

name: docker

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    name: Build and push server image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute lowercase image name
        id: image
        run: |
          owner=$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/tradingagents-webgui-server" >> "${GITHUB_OUTPUT}"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          # Tag strategy: v1.2.3 -> "1.2.3" + moving "1.2"; moving "latest"
          # ONLY on v-tags (the compose upgrade target); manual dispatch builds
          # get a traceable sha tag only, never latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
